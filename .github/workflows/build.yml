name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Usa Gradle 8.1.1 (compatible con ForgeGradle 6 / 1.20.1), asi no hace falta subir el wrapper.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.1.1

      - name: Compilar
        run: gradle build --no-daemon

      - name: Subir el .jar
        uses: actions/upload-artifact@v4
        with:
          name: quitamarca
          path: build/libs/*.jar

  release:
    # Solo al subir una etiqueta, por ejemplo: git tag v1.0.0 && git push origin v1.0.0
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: quitamarca
          path: libs

      - name: Crear release
        uses: softprops/action-gh-release@v2
        with:
          files: libs/*.jar
          generate_release_notes: true
