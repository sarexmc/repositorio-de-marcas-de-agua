modLoader="javafml"
loaderVersion="[47,)"
license="MIT"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="QuitaMarca"
description='''
Elimina de la pantalla cualquier imagen de 2000 píxeles o más (por ejemplo, marcas de agua de otros mods).
Ponlo en el cliente y en el servidor. Comandos: /marcaescanear y /marca ocultar|mostrar|lista|limpiar.
'''
displayTest="IGNORE_SERVER_VERSION"

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="[47,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="[1.20.1,1.21)"
ordering="NONE"
side="BOTH"

[[mixins]]
config="quitamarca.mixins.json"
